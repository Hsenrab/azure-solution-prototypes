model_list:
  - model_name: azure-gpt-5.4
    litellm_params:
      model: os.environ/AZURE_MODEL_DEPLOYMENT
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 180